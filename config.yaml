# Solar Panel Stain Detection & Severity Classification Configuration
# Task: Given a solar panel image, segment stains and classify as High Stain or Low Stain with coverage %

seed: 42

label_rules:
  stain_types:
    - bird_dropping
    - dust_soiling
    - mud
  out_of_scope:
    - snow
    - physical_damage
    - electrical_damage
  coverage_threshold_pct: 10.0      # Coverage >= 10.0% -> High stain
  bird_blob_threshold_pct: 2.0      # Any single bird-dropping blob >= 2.0% -> High stain
  grid_rows: 4                      # 4x4 grid cells for sub-panel area breakdown
  grid_cols: 4

data:
  raw_dir: "data/raw"
  processed_dir: "data/processed"
  manifest_path: "data/manifest.csv"
  splits:
    train_ratio: 0.70
    val_ratio: 0.15
    test_ratio: 0.15
  img_size: [512, 512]              # [height, width] for panel inspection
  min_dim_filter: 224               # Filter out corrupt/small images < 224px
  phash_similarity_threshold: 4     # Hamming distance <= 4 considered near-duplicate

stage_a_panel_detector:
  architecture: "yolo_rectifier_baseline" # Baseline quadrilateral localization & perspective warp
  output_size: [512, 512]
  pad_margin: 0.02

stage_b_stain_segmenter:
  model_type: "unet"                # "unet" or "deeplabv3plus"
  encoder_name: "resnet34"          # "resnet34", "efficientnet-b3", "resnet50"
  encoder_weights: "imagenet"
  in_channels: 3
  classes: 1                        # Binary stain mask (stain vs panel)
  multiclass: false                 # When true, channels for [dust, bird_dropping, mud]
  loss:
    dice_weight: 0.5
    focal_weight: 0.5
    focal_gamma: 2.0
    smooth: 1.0
  training:
    epochs_frozen: 2
    epochs_unfrozen: 3
    lr_frozen: 1.0e-3
    lr_unfrozen: 2.0e-4
    weight_decay: 1.0e-4
    batch_size: 16
    num_workers: 0                  # 0 for Windows compatibility
    early_stopping_patience: 4
    cosine_warmup_epochs: 1
    tta_enabled: true               # Test-time augmentation (hflip, vflip, scales)

baseline_classifier:
  backbone: "resnet18"              # "resnet18", "efficientnet_b0", "convnext_tiny"
  pretrained: true
  num_classes: 2                    # 0: Low Stain, 1: High Stain
  lr: 3.0e-4
  weight_decay: 1.0e-4
  batch_size: 16
  epochs: 8
  early_stopping_patience: 4

evaluation:
  high_class_weight_penalty: 2.0    # Prioritize recall on High stain
  target_metrics:
    stain_iou_min: 0.70
    macro_f1_min: 0.92
    high_recall_min: 0.95
    max_cross_dataset_drop: 0.08
  reports_dir: "reports"
  errors_dir: "reports/errors"
